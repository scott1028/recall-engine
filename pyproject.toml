[project]
name = "recall-engine"
version = "0.1.0"
description = "Thin launcher engine that wraps an agent CLI (claude/codex/pi/gemini) with a knowledge repo skill and syncs Markdown notes with Google Drive."
requires-python = ">=3.10"
dependencies = [
    "typer>=0.27.3",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.61.0",
    "jinja2>=3.1.6",
    "mcp>=2.3.0,<3",
    "tomlkit>=0.15.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
recall-engine = "recall_engine.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall_engine"]
